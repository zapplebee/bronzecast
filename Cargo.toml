[package]
name = "bronzecast"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
chrono = "0.4"
image = { version = "0.24.9", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
macroquad = "0.4"
resvg = { version = "0.45.1", default-features = false }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tobj = "4"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
